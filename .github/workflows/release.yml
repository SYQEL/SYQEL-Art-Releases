# SYQEL Art — desktop release workflow. Clones the private GitLab source at build time, builds
# macOS + Windows, OS-signs (Apple/Azure), updater-signs, publishes installers + latest.json.
name: release-desktop
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      # this repo, for RELEASE_NOTES.md (the private source is cloned separately, below)
      - uses: actions/checkout@v4

      - name: Clone private source
        run: git clone --depth 1 --branch main "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/syqel/syqel-art.git" source

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install deps
        # Private @syqel/* packages live on GitHub Packages — append the read token before install
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> .npmrc
          pnpm install --frozen-lockfile
        working-directory: source

      # Windows code-signing via Azure Trusted Signing — the CLI tauri.conf's signCommand calls.
      - name: Install trusted-signing-cli (Windows)
        if: matrix.platform == 'windows-latest'
        run: cargo install trusted-signing-cli

      # Release notes are ALWAYS customer-facing. With no releaseBody the release ships with an empty
      # body and GitHub surfaces the tag's COMMIT MESSAGE instead — ours are engineering notes and one
      # has already named a token on a public page. Render RELEASE_NOTES.md and pass it explicitly.
      - name: Render release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          body="$(sed "s/{{VERSION}}/${version}/g" RELEASE_NOTES.md)"
          {
            echo 'body<<SYQEL_NOTES_EOF'
            echo "$body"
            echo 'SYQEL_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required to publish the GitHub Release
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: source/apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'SYQEL Art ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
